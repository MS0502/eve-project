name: Temporary M2-A filtered-read fix

on:
  push:
    branches: [codex/m2-a-sqlite-shadow-persistence]

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'MS0502/eve-project'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/m2-a-sqlite-shadow-persistence
          fetch-depth: 0

      - name: Apply fail-closed filtered-read fix and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          core_path = root / "core/sqlite_shadow_store.py"
          test_path = root / "tests/test_v4_m2_a_sqlite_shadow_store.py"
          manifest_path = root / "docs/audit/FORWARD_ADDITIONS_MANIFEST.json"
          workflow_path = root / ".github/workflows/m2a-filtered-read-fix.yml"

          core = core_path.read_text(encoding="utf-8")
          old = "        with self._connect() as connection:\n            if stream_id is None:\n"
          new = "        with self._connect() as connection:\n            self._event_state(connection)\n            if stream_id is None:\n"
          if core.count(old) != 1:
              raise SystemExit("unexpected SQLiteShadowStore.events implementation")
          core_path.write_text(core.replace(old, new), encoding="utf-8")

          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_verified_backups_are_bounded_without_touching_event_history(tmp_path: Path):\n"
          addition = '''def test_filtered_stream_read_and_restore_do_not_hide_index_corruption(tmp_path: Path):
              path = tmp_path / "shadow.sqlite3"
              store = SQLiteShadowStore(path)
              store.initialize()
              store.append(event(1))
              connection = sqlite3.connect(path)
              try:
                  connection.execute("DROP TRIGGER events_no_update")
                  connection.execute("UPDATE events SET stream_id='shadow:wrong' WHERE event_id='event:1'")
                  connection.execute(EVENT_UPDATE_TRIGGER)
                  connection.commit()
              finally:
                  connection.close()

              with pytest.raises(PersistedEventCorruption):
                  store.events(stream_id="shadow:test")
              with pytest.raises(PersistedEventCorruption):
                  store.restore_verified(
                      stream_id="shadow:test",
                      initial_state=State(0),
                      reducer=reduce_state,
                      state_to_mapping=lambda state: {"total": state.total},
                      state_from_mapping=lambda value: State(int(value["total"])),
                  )


          '''
          addition = "\n".join(line[10:] if line.startswith("          ") else line for line in addition.splitlines()) + "\n"
          if tests.count(marker) != 1 or "test_filtered_stream_read_and_restore_do_not_hide_index_corruption" in tests:
              raise SystemExit("unexpected M2-A test insertion point")
          test_path.write_text(tests.replace(marker, addition + marker), encoding="utf-8")

          paths = {
              "core/sqlite_shadow_store.py",
              "tests/test_v4_m2_a_sqlite_shadow_store.py",
          }
          with tempfile.TemporaryDirectory() as directory:
              suggested_path = Path(directory) / "suggested.json"
              subprocess.run(
                  [
                      sys.executable,
                      str(root / "scripts/audit/forward_regression_gate.py"),
                      "--suggest-manifest-for-pr",
                      "161",
                      "--output",
                      str(suggested_path),
                  ],
                  cwd=root,
                  check=True,
              )
              current = json.loads(manifest_path.read_text(encoding="utf-8"))
              suggested = json.loads(suggested_path.read_text(encoding="utf-8"))

          current_by_path = {
              group["path"]: group
              for group in current["registered_addition_groups"]
              if group.get("introduced_by_pr") == 161 and group.get("path") in paths
          }
          suggested_by_path = {
              group["path"]: group
              for group in suggested["registered_addition_groups"]
              if group.get("path") in paths
          }
          if set(current_by_path) != paths or set(suggested_by_path) != paths:
              raise SystemExit("missing expected PR #161 manifest groups")

          replacements = []
          for path in sorted(paths):
              replacement = dict(suggested_by_path[path])
              existing = current_by_path[path]
              replacement["rationale"] = existing["rationale"]
              replacement["owner"] = existing["owner"]
              replacement["disposition"] = existing["disposition"]
              replacements.append(replacement)

          current["registered_addition_groups"] = sorted(
              [
                  group
                  for group in current["registered_addition_groups"]
                  if not (
                      group.get("introduced_by_pr") == 161
                      and group.get("path") in paths
                  )
              ]
              + replacements,
              key=lambda group: (group["introduced_by_pr"], group["path"]),
          )
          manifest_path.write_text(
              json.dumps(current, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          workflow_path.unlink()
          PY

      - name: Commit fixed exact head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/sqlite_shadow_store.py \
            tests/test_v4_m2_a_sqlite_shadow_store.py \
            docs/audit/FORWARD_ADDITIONS_MANIFEST.json \
            .github/workflows/m2a-filtered-read-fix.yml
          git commit -m "Fail closed on filtered event reads"
          git push origin HEAD:codex/m2-a-sqlite-shadow-persistence
