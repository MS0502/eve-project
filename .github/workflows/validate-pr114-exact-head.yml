name: Validate PR 114 exact head

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Diagnose exact full-suite result
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/validate-pr114.sh
          bash /tmp/validate-pr114.sh
