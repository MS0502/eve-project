name: Validate PR 114 exact head

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR 114 head
        uses: actions/checkout@v4
        with:
          ref: c007ba68526a9bb491491ba10af6452ef7acdeee
          fetch-depth: 1

      - name: Verify exact revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c007ba68526a9bb491491ba10af6452ef7acdeee"
          git status --short

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile
        run: python -m compileall -q adapters core cognition tests main.py scripts

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run full suite
        run: python -m pytest -q
