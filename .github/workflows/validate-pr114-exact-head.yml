name: Validate PR 114 exact head

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate exact PR 114 head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/eve-pr114 && git clone -q https://github.com/MS0502/eve-project.git /tmp/eve-pr114 && cd /tmp/eve-pr114 && git checkout -q c007ba68526a9bb491491ba10af6452ef7acdeee && test "$(git rev-parse HEAD)" = c007ba68526a9bb491491ba10af6452ef7acdeee && test -z "$(git status --short)"
          echo EXACT_SHA_OK=c007ba68526a9bb491491ba10af6452ef7acdeee
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          python -m pip check
          python - <<'PY'
          import numpy
          import pytest
          print(f"numpy={numpy.__version__}")
          print(f"pytest={pytest.__version__}")
          PY
          echo DEPENDENCIES_OK
          python -m compileall -q adapters core cognition tests main.py scripts
          echo COMPILE_OK
          python -m pytest --collect-only -q > /tmp/collect.log 2>&1 || { tail -n 100 /tmp/collect.log | fold -w 110; exit 1; }
          tail -n 10 /tmp/collect.log | fold -w 110
          echo COLLECTION_OK
          python -m pytest -q > /tmp/pytest.log 2>&1 || { tail -n 160 /tmp/pytest.log | fold -w 110; exit 1; }
          tail -n 30 /tmp/pytest.log | fold -w 110
          echo FULL_SUITE_OK
