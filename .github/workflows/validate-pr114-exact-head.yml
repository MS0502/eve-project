name: Validate PR 114 exact head

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR 114 head
        uses: actions/checkout@v4
        with:
          ref: c007ba68526a9bb491491ba10af6452ef7acdeee
          fetch-depth: 1
      - name: Verify exact revision
        run: |
          test "$(git rev-parse HEAD)" = c007ba68526a9bb491491ba10af6452ef7acdeee
          test -z "$(git status --short)"
          echo EXACT_SHA_OK
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q "https://files.pythonhosted.org/packages/72/d2/ef65d0f3c150bfc99f5c4a516ae57e7c3acddfaacc1196dd296b1299ea7f/markdown_strings-3.4.0.tar.gz#sha256=7574de0606160d7291ac2e1933a8ed47d31f0b49b674f128da1f548930c8578b"
          python -m pip install -q -r requirements.txt
          python -m pip check
          echo DEPENDENCIES_OK
      - name: Compile
        run: |
          python -m compileall -q adapters core cognition tests main.py scripts
          echo COMPILE_OK
      - name: Collect tests
        run: |
          python -m pytest --collect-only -q > /tmp/collect.log 2>&1
          tail -n 2 /tmp/collect.log
          echo COLLECTION_OK
      - name: Run full suite
        continue-on-error: true
        run: |
          set +e
          python -m pytest -q > /tmp/pytest.log 2>&1
          echo $? > /tmp/pytest.rc
          exit 0
      - name: Report exact result
        if: always()
        run: |
          rc=$(cat /tmp/pytest.rc)
          grep -E '^(FAILED|ERROR) ' /tmp/pytest.log | head -n 120 || true
          tail -n 40 /tmp/pytest.log
          echo FULL_SUITE_RC=$rc
          exit "$rc"
