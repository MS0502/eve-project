name: Validate PR 114 exact head

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Diagnose exact-head dependency install
        shell: bash
        run: |
          set -o pipefail
          rm -rf /tmp/eve-pr114 && git clone -q https://github.com/MS0502/eve-project.git /tmp/eve-pr114 && cd /tmp/eve-pr114 && git checkout -q c007ba68526a9bb491491ba10af6452ef7acdeee && test "$(git rev-parse HEAD)" = c007ba68526a9bb491491ba10af6452ef7acdeee
          echo EXACT_SHA_OK=c007ba68526a9bb491491ba10af6452ef7acdeee
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt 2>&1 | fold -w 110
