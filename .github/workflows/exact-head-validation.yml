                      'e8a7cd32b1e7192e64274b385ff4d5c6482d07be3e4a3e8f509b00497e9efa7e': 1,
                      'e9bdd2b25a309f10fb86c70ae769b7558380cccf90faf82f622bfb53f6506205': 1,
                      'f9afcc3677012bff645a339ebda510f63230e534defe864fc497c18fed79ec3b': 1,
                  },
                  'introduced_by_pr': 150,
                  'owner': 'M1-E shadow acceptance verification',
                  'path': 'tests/test_v4_m1_e_shadow_acceptance.py',
                  'rationale': 'Focused fail-closed evidence for explicit success, legacy-failure and observer-failure cases; deterministic replay/equivalence; checkpoint/rollback; lifecycle coverage; case binding; zero unauthorized effects; and permanent prevention of automatic human acceptance, v4.2 eligibility, persistence, or runtime authority.',
