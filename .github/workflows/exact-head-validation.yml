name: M2-D CLI correction

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/m2-d-recovery-rehearsal
          fetch-depth: 0
      - name: Correct audit CLI import boundary and add regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/audit/m2_d_rehearsal.py')
          text = script.read_text(encoding='utf-8')
          old = '''import argparse\nimport json\nimport tempfile\nfrom pathlib import Path\nfrom typing import Any, Mapping\n\nfrom core.event_kernel import EventEnvelope'''
          new = '''import argparse\nimport json\nimport sys\nimport tempfile\nfrom pathlib import Path\nfrom typing import Any, Mapping\n\nROOT = Path(__file__).resolve().parents[2]\nif str(ROOT) not in sys.path:\n    sys.path.insert(0, str(ROOT))\n\nfrom core.event_kernel import EventEnvelope'''
          if text.count(old) != 1:
              raise SystemExit('unexpected M2-D CLI import block')
          script.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_v4_m2_d_rehearsal.py')
          text = tests.read_text(encoding='utf-8')
          marker = 'def test_audit_cli_runs_from_repo_root_and_writes_packet'
          if marker in text:
              raise SystemExit('CLI regression test already exists')
          text += '''\n\ndef test_audit_cli_runs_from_repo_root_and_writes_packet(tmp_path: Path):\n    output = tmp_path / "m2-d-rehearsal.json"\n    result = __import__("subprocess").run(\n        [\n            __import__("sys").executable,\n            str(ROOT / "scripts/audit/m2_d_rehearsal.py"),\n            "--output",\n            str(output),\n            "--pretty",\n        ],\n        cwd=ROOT,\n        check=False,\n        capture_output=True,\n        text=True,\n    )\n    assert result.returncode == 0, result.stderr\n    packet = __import__("json").loads(output.read_text(encoding="utf-8"))\n    assert packet["machine_passed"] is True\n    assert packet["human_accepted"] is False\n    assert packet["authoritative_recovery"] is False\n    assert packet["cutover_authorized"] is False\n'''
          tests.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/audit/m2_d_rehearsal.py tests/test_v4_m2_d_rehearsal.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit/m2_d_rehearsal.py tests/test_v4_m2_d_rehearsal.py
          git commit -m 'Fix M2-D audit CLI execution boundary'
          git push origin HEAD:codex/m2-d-recovery-rehearsal
