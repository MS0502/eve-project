name: Exact-head validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA to validate
        required: true
        type: string
      base_sha:
        description: Base commit SHA for scope and invariance checks
        required: true
        type: string
      focused_tests:
        description: Optional newline-separated tests paths
        required: false
        type: string

concurrency:
  group: exact-head-validation-${{ github.event.pull_request.number || inputs.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.sha }}
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_sha }}
      CURRENT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
      REQUESTED_FOCUSED_TESTS: ${{ inputs.focused_tests }}
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Verify exact head and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          test -z "$(git status --short)"
          git rev-parse HEAD | tee /tmp/final-head.txt
          git diff --name-only "$BASE_SHA"..."$TARGET_SHA" | sort | tee /tmp/changed-files.txt

      - name: Install hash-pinned validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip check
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys
          import urllib.request

          contract = json.loads(pathlib.Path('docs/audit/VALIDATION_CONTRACT.json').read_text(encoding='utf-8'))
          artifact = contract['compatibility_artifact']
          url = 'https://files.pythonhosted.org/packages/72/d2/ef65d0f3c150bfc99f5c4a516ae57e7c3acddfaacc1196dd296b1299ea7f/markdown_strings-3.4.0.tar.gz'
          assert hashlib.sha256(url.encode()).hexdigest() == artifact['url_sha256']
          target = pathlib.Path('/tmp') / artifact['name']
          urllib.request.urlretrieve(url, target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == artifact['content_sha256']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(target)])
          PY
          EVE_VALIDATION_COMMIT="$(git rev-parse HEAD)" \
          EVE_VALIDATION_TREE="$(git rev-parse HEAD^{tree})" \
          EVE_VALIDATION_IDENTITY_OUTPUT=/tmp/validation-identity.json \
            python scripts/audit/validation_preflight.py

      - name: Compile changed Python
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_python < <(grep -E '\.py$' /tmp/changed-files.txt || true)
          if ((${#changed_python[@]})); then
            python -m compileall -q "${changed_python[@]}"
          fi

      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          {
            grep -E '^tests/.*\.py$' /tmp/changed-files.txt || true
            printf '%s\n' "$REQUESTED_FOCUSED_TESTS"
          } | sed '/^[[:space:]]*$/d' | sort -u > /tmp/focused-paths.txt
          if test -s /tmp/focused-paths.txt; then
            mapfile -t focused < /tmp/focused-paths.txt
            set +e
            python -m pytest -q --tb=short "${focused[@]}" > /tmp/focused.txt 2>&1
            status=$?
            set -e
            cat /tmp/focused.txt
            exit "$status"
          else
            printf '%s\n' 'No focused tests selected.' | tee /tmp/focused.txt
          fi

      - name: Generate M2-D recovery rehearsal evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit/m2_d_rehearsal.py --output /tmp/m2-d-rehearsal.json --pretty

      - name: Generate M2-E cutover candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit/m2_e_cutover.py \
            --m2-d-packet /tmp/m2-d-rehearsal.json \
            --candidate-head "$TARGET_SHA" \
            --workflow "${{ github.run_id }}" \
            --output /tmp/m2-e-cutover-candidate.json \
            --pretty

      - name: Verify M0 audit invariance
        shell: bash
        run: |
          set -euo pipefail
          for phase in base head; do
            if test "$phase" = base; then sha="$BASE_SHA"; else sha="$TARGET_SHA"; fi
            git checkout --detach "$sha"
            test -z "$(git status --short)"
            for item in \
              a:scripts/audit/m0_a_runtime_inventory.py \
              b:scripts/audit/m0_b_controlflow_concurrency_inventory.py \
              c:scripts/audit/m0_c_persistence_state_inventory.py \
              d:scripts/audit/m0_d_component_inventory.py; do
              name="${item%%:*}"
              script="${item#*:}"
              python "$script" --output "/tmp/${phase}-${name}.json"
            done
          done
          git checkout --detach "$TARGET_SHA"
          for name in a b c d; do diff -u "/tmp/base-${name}.json" "/tmp/head-${name}.json"; done
          test -z "$(git status --short)"
          printf '%s\n' 'M0-A through M0-D canonical outputs are byte-identical.' | tee /tmp/invariance.txt

      - name: Extract M2-B read-capability candidates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit/m2_b_read_capability_manifest.py --output /tmp/m2-b-read-capability-candidates.json --pretty

      - name: Validate exact M2-B technical decisions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          addition_args=()
          if test -d docs/audit/m2_b_decision_additions; then
            while IFS= read -r path; do addition_args+=(--additions "$path"); done < <(find docs/audit/m2_b_decision_additions -type f -name '*.json' | sort)
          fi
          python scripts/audit/m2_b_decision_groups.py \
            --candidate /tmp/m2-b-read-capability-candidates.json \
            --decisions docs/audit/M2_B_READ_CAPABILITY_DECISION_GROUPS.json \
            "${addition_args[@]}" \
            --output /tmp/m2-b-decision-validation.json \
            --pretty --strict
          cat /tmp/m2-b-decision-validation.json

      - name: Verify forward regression gate
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if test -n "$CURRENT_PR"; then args+=(--current-pr "$CURRENT_PR" --base-sha "$BASE_SHA"); fi
          python scripts/audit/forward_regression_bundle.py --output /tmp/forward-regression.json --pretty "${args[@]}"
          cat /tmp/forward-regression.json

      - name: Collect full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q | tee /tmp/collect.txt

      - name: Run full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q | tee /tmp/full.txt

      - name: Verify final worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --short)"

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-head-validation-${{ env.TARGET_SHA }}
          path: |
            /tmp/final-head.txt
            /tmp/changed-files.txt
            /tmp/validation-identity.json
            /tmp/focused-paths.txt
            /tmp/focused.txt
            /tmp/m2-d-rehearsal.json
            /tmp/m2-e-cutover-candidate.json
            /tmp/invariance.txt
            /tmp/forward-regression.json
            /tmp/m2-b-read-capability-candidates.json
            /tmp/m2-b-decision-validation.json
            /tmp/base-a.json
            /tmp/head-a.json
            /tmp/base-b.json
            /tmp/head-b.json
            /tmp/base-c.json
            /tmp/head-c.json
            /tmp/base-d.json
            /tmp/head-d.json
            /tmp/collect.txt
            /tmp/full.txt
          if-no-files-found: error
