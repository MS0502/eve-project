name: Exact-head validation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-manifest-registration:
    if: github.event.pull_request.number == 150
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Append reviewed PR150 registration
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/audit/FORWARD_ADDITIONS_MANIFEST.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          groups = data['registered_addition_groups']
          if any(group.get('introduced_by_pr') == 150 for group in groups):
              raise SystemExit(0)

          groups.extend([
              {
                  'categories': ['adaptive_numeric', 'mutation'],
                  'disposition': 'M1_E_SHADOW_ACCEPTANCE',
                  'fingerprints': {
                      '0730a528dbdd6b803ddcb0ea2fcb149cbbc4237c8f7a349d739b23840623de9b': 1,
                      '405eefffe4a788042f7fd39b6d3843c8cc924cab9caa32a8a2fb49e91a8c6d0b': 1,
                      '486532debe676e22a8f708178b28e280149dac90f5a798808114ab1c7a8ed96b': 1,
                      '5b058f644dc8a6e0088a8ec9075b16d526100528a8a4ba0dd6b095e0419468ce': 1,
                      '669849d0641e269122140499d8fc427770386d8548853b4926e8ea303c0d97b9': 1,
                      '6de5b3419f80c5dbd9cf84a0f2ad0d78b2a5e227af19391432fc3d65ffdcc125': 1,
                      '8203ece51b4eae416869e2461cec71a35c0605133360172a18cc91ac5e463c76': 1,
                      '89c677a22bae83ac79087cf3f4958c2c8cb73f4c12f027e9b79a0d5055f23446': 1,
                      'ce24732d37d1b5ed1aab93c3d0a4efeb5dfc68dcf9cbf3cb44f75ff850a041cd': 1,
                      'e7ac5f4eb90ca2e32ed5ca3c0b40ee6a9d7bff3e288876f7bec4ca9eb071513c': 1,
                      'f84997fcce81e8d2ab2c809f70c2729b41df951afa80abda813326d4cf69f1d6': 1,
                  },
                  'introduced_by_pr': 150,
                  'owner': 'M1-E shadow acceptance evidence',
                  'path': 'core/shadow_acceptance.py',
                  'rationale': 'Deterministic in-memory evaluation of bounded M1-B observation/failure evidence through M1-C replay, equivalence, checkpoint/rollback and M1-D lifecycle coverage. Human acceptance and v4.2 eligibility remain fixed false; no production integration, persistence, retry, suppression, recovery, scheduling, external effect, or cutover authority is included.',
                  'symbols': [
                      'LegacyPreservationEvidence.__post_init__',
                      '_lifecycle_domains',
                      '_observer_failure_digest',
                      '_record_digest',
                      'evaluate_m1_shadow_window',
                  ],
              },
              {
                  'categories': ['adaptive_numeric', 'mutation'],
                  'disposition': 'TEST_EVIDENCE',
                  'fingerprints': {
                      '1333a1af929a80d55bc48dc77c5d11bf90da044f1b65ae4d32282d62c1e390bc': 1,
                      '16408d1ea798726d670f96974d9a85eccf944aeeb87e0ba7902c7833cac8388a': 2,
                      '23601afdfab87a4a4a3cc182509efdc666a1dbed85b4c1d0f767fb80a5781d4d': 1,
