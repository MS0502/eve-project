name: Exact-head validation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  register-pr-152:
    if: github.event.pull_request.number == 152
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Append reviewed findings and restore validator
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/audit/FORWARD_ADDITIONS_MANIFEST.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          groups = data['registered_addition_groups']
          if any(group.get('introduced_by_pr') == 152 for group in groups):
              raise SystemExit('PR #152 is already registered')

