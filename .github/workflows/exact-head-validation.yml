name: Exact-head validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  apply-m2a-stream-isolation-fix:
    if: github.event.pull_request.number == 161
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/m2-a-sqlite-shadow-persistence
          fetch-depth: 0
          show-progress: false

      - name: Apply stream-isolated snapshot selection and refresh manifest
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          core_path = root / "core/sqlite_shadow_store.py"
          test_path = root / "tests/test_v4_m2_a_sqlite_shadow_store.py"
          manifest_path = root / "docs/audit/FORWARD_ADDITIONS_MANIFEST.json"

          core = core_path.read_text(encoding="utf-8")
          old = '''        with self._connect() as connection:
              rows = connection.execute("SELECT * FROM snapshots ORDER BY ordinal DESC").fetchall()
              for row in rows:
          '''
          new = '''        with self._connect() as connection:
              rows = connection.execute(
                  "SELECT * FROM snapshots WHERE stream_id=? ORDER BY ordinal DESC",
                  (stream_id,),
              ).fetchall()
              for row in rows:
          '''
          if core.count(old) != 1:
              raise SystemExit("unexpected restore snapshot selection block")
          core_path.write_text(core.replace(old, new), encoding="utf-8")

          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_restore_uses_fresh_canonical_start_state_for_each_replay(tmp_path: Path):\n"
          addition = '''def test_restore_snapshot_selection_is_isolated_to_requested_stream(tmp_path: Path):
              path = tmp_path / "shadow.sqlite3"
              store = SQLiteShadowStore(path)
              store.initialize()
              store.append(event(1))
              store.write_snapshot(
                  snapshot_id="snapshot:requested",
                  stream_id="shadow:test",
                  through_sequence=1,
                  state={"total": 1},
                  state_schema_version="test.state.v1",
              )
              store.append(event(1, event_id="other:event:1", stream="shadow:other"))
              store.write_snapshot(
                  snapshot_id="snapshot:other",
                  stream_id="shadow:other",
                  through_sequence=1,
                  state={"total": 1},
                  state_schema_version="test.state.v1",
              )
              connection = sqlite3.connect(path)
              try:
                  connection.execute("DROP TRIGGER snapshots_no_update")
                  connection.execute(
                      "UPDATE snapshots SET state_digest=? WHERE snapshot_id='snapshot:other'",
                      ("0" * 64,),
                  )
                  connection.execute(
                      "CREATE TRIGGER snapshots_no_update BEFORE UPDATE ON snapshots "
                      "BEGIN SELECT RAISE(ABORT,'append-only snapshots'); END"
                  )
                  connection.commit()
              finally:
                  connection.close()

              result = store.restore_verified(
                  stream_id="shadow:test",
                  initial_state=State(0),
                  reducer=reduce_state,
                  state_to_mapping=lambda state: {"total": state.total},
                  state_from_mapping=lambda value: State(int(value["total"])),
              )
              assert result.state == State(1)
              assert result.snapshot_id == "snapshot:requested"
              assert result.rejected_snapshot_ids == ()


          '''
          addition = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in addition.splitlines()
          ) + "\n"
          if tests.count(marker) != 1 or "test_restore_snapshot_selection_is_isolated_to_requested_stream" in tests:
              raise SystemExit("unexpected restore stream-isolation test insertion point")
          test_path.write_text(tests.replace(marker, addition + marker), encoding="utf-8")

          subprocess.run(
              [sys.executable, "-m", "compileall", "-q", str(core_path), str(test_path)],
              cwd=root,
              check=True,
          )

          paths = {
              "core/sqlite_shadow_store.py",
              "tests/test_v4_m2_a_sqlite_shadow_store.py",
          }
          with tempfile.TemporaryDirectory() as directory:
              suggested_path = Path(directory) / "suggested.json"
              subprocess.run(
                  [
                      sys.executable,
                      str(root / "scripts/audit/forward_regression_gate.py"),
                      "--suggest-manifest-for-pr",
                      "161",
                      "--output",
                      str(suggested_path),
                  ],
                  cwd=root,
                  check=True,
              )
              current = json.loads(manifest_path.read_text(encoding="utf-8"))
              suggested = json.loads(suggested_path.read_text(encoding="utf-8"))

          current_by_path = {
              group["path"]: group
              for group in current["registered_addition_groups"]
              if group.get("introduced_by_pr") == 161 and group.get("path") in paths
          }
          suggested_by_path = {
              group["path"]: group
              for group in suggested["registered_addition_groups"]
              if group.get("path") in paths
          }
          if set(current_by_path) != paths or set(suggested_by_path) != paths:
              raise SystemExit("missing expected PR #161 manifest groups")

          replacements = []
          for path in sorted(paths):
              replacement = dict(suggested_by_path[path])
              existing = current_by_path[path]
              replacement["rationale"] = existing["rationale"]
              replacement["owner"] = existing["owner"]
              replacement["disposition"] = existing["disposition"]
              replacements.append(replacement)

          current["registered_addition_groups"] = sorted(
              [
                  group
                  for group in current["registered_addition_groups"]
                  if not (
                      group.get("introduced_by_pr") == 161
                      and group.get("path") in paths
                  )
              ]
              + replacements,
              key=lambda group: (group["introduced_by_pr"], group["path"]),
          )
          manifest_path.write_text(
              json.dumps(current, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          git show "$BASE_SHA:.github/workflows/exact-head-validation.yml" > .github/workflows/exact-head-validation.yml

      - name: Commit final stream-isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Isolate snapshot restore selection by stream"
          git push origin HEAD:codex/m2-a-sqlite-shadow-persistence
