name: Exact-head validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  diagnose-m2a-snapshot-hardening:
    if: github.event.pull_request.number == 161
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Run staged payload with concise diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git clone --quiet --branch codex/m2-a-sqlite-shadow-persistence \
            "https://x-access-token:${GH_TOKEN}@github.com/MS0502/eve-project.git" repo
          cd repo
          cat .github/m2a-snapshot-fix.part* | base64 -d > /tmp/apply-m2a.py
          python /tmp/apply-m2a.py
