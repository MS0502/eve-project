                      '_observe',
                      '_snapshot.capture',
                      '_window_fixture',
                      'test_acceptance_module_has_no_legacy_import_io_clock_thread_or_auto_acceptance',
                      'test_same_window_is_deterministic_and_packet_record_is_detached',
                  ],
              },
          ])
          total = sum(
              sum(group['fingerprints'].values())
              for group in groups
          )
          if total != 275:
              raise SystemExit(f'unexpected registration total: {total}')
          path.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(',', ':'),
              ) + '\n',
              encoding='utf-8',
          )
          PY
          if git diff --quiet -- docs/audit/FORWARD_ADDITIONS_MANIFEST.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/audit/FORWARD_ADDITIONS_MANIFEST.json
          git commit -m 'Register M1-E forward findings'
          git push origin "HEAD:${HEAD_BRANCH}"
