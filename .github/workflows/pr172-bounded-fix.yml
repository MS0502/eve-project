name: PR172 bounded compatibility correction

on:
  push:
    branches:
      - codex/m3-b-legacy-26-axis-immutable-capture

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/m3-b-legacy-26-axis-immutable-capture
          fetch-depth: 0
      - name: Apply reviewed correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('core/m3_b_legacy_affect_capture.py')
          text = core.read_text(encoding='utf-8')
          old_import = 'from core.m3_b_affect_projection import AxisObservation\n'
          new_import = 'from core.m3_b_affect_projection import AffectProjectionError, AxisObservation\n'
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import)
          old_method = '''    def to_axis_observations(self) -> tuple[AxisObservation, ...]:
        return tuple(
            AxisObservation(
                axis=axis.axis,
                source_family="legacy_mutable_hormone",
                value=axis.value,
                baseline=axis.baseline,
                floor=axis.floor,
                ceiling=axis.ceiling,
                confidence=axis.confidence,
                source_snapshot_id=self.source_snapshot_id,
                source_schema_version=self.schema_version,
                source_integrity_digest=self.source_integrity_digest,
                source_metadata=(
                    ("axis_integrity_digest", axis.axis_integrity_digest),
                    ("capture_digest", self.capture_digest),
                    ("decay_rate", repr(axis.decay_rate)),
                    ("phase", str(axis.phase)),
                    ("reactivity", repr(axis.reactivity)),
                    ("source_instance_id", self.source_instance_id),
                    ("tier", axis.tier),
                ),
            )
            for axis in self.axes
        )
'''
          new_method = '''    def to_axis_observations(self) -> tuple[AxisObservation, ...]:
        """Convert only when the merged v1 observation bounds admit every baseline."""
        try:
            return tuple(
                AxisObservation(
                    axis=axis.axis,
                    source_family="legacy_mutable_hormone",
                    value=axis.value,
                    baseline=axis.baseline,
                    floor=axis.floor,
                    ceiling=axis.ceiling,
                    confidence=axis.confidence,
                    source_snapshot_id=self.source_snapshot_id,
                    source_schema_version=self.schema_version,
                    source_integrity_digest=self.source_integrity_digest,
                    source_metadata=(
                        ("axis_integrity_digest", axis.axis_integrity_digest),
                        ("capture_digest", self.capture_digest),
                        ("decay_rate", repr(axis.decay_rate)),
                        ("phase", str(axis.phase)),
                        ("reactivity", repr(axis.reactivity)),
                        ("source_instance_id", self.source_instance_id),
                        ("tier", axis.tier),
                    ),
                )
                for axis in self.axes
            )
        except AffectProjectionError as exc:
            raise LegacyAffectCaptureError(
                "captured legacy baseline is incompatible with the merged M3-B observation bounds"
            ) from exc
'''
          assert text.count(old_method) == 1
          core.write_text(text.replace(old_method, new_method), encoding='utf-8')

          tests = Path('tests/test_v4_m3_b_legacy_affect_capture.py')
          text = tests.read_text(encoding='utf-8')
          assert text.count('source = HormoneSystem(phase=3, developmental_stage="newborn")') == 1
          text = text.replace(
              'source = HormoneSystem(phase=3, developmental_stage="newborn")',
              'source = HormoneSystem(phase=3, developmental_stage="adult")',
          )
          marker = '''    assert all(observation.confidence == 1.0 for observation in observations)\n\n\n'''
          insertion = '''    assert all(observation.confidence == 1.0 for observation in observations)\n\n\ndef test_capture_preserves_boundary_baselines_and_projection_bridge_fails_closed():
    source = HormoneSystem(phase=3, developmental_stage="newborn")
    result = capture(source)
    by_axis = {axis.axis: axis for axis in result.axes}
    assert by_axis["estrogen"].baseline == by_axis["estrogen"].floor == 0.0
    assert by_axis["testosterone"].baseline == by_axis["testosterone"].floor == 0.0
    with pytest.raises(LegacyAffectCaptureError, match="incompatible with the merged M3-B"):
        result.to_axis_observations()
\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, insertion)
          text = text.replace('match="outside \\[0,1\\]"', 'match=r"outside \\[0,1\\]"')
          tests.write_text(text, encoding='utf-8')

          doc = Path('docs/audit/M3_B_LEGACY_26_AXIS_IMMUTABLE_CAPTURE_CANDIDATE.md')
          text = doc.read_text(encoding='utf-8')
          old = '''`LegacyHormoneCapture.to_axis_observations()` returns exactly 26 immutable `AxisObservation` values accepted by the merged M3-B projection contract.\n'''
          new = '''`LegacyHormoneCapture.to_axis_observations()` returns exactly 26 immutable `AxisObservation` values when every captured baseline is strictly inside its declared source range, as required by the merged M3-B v1 projection contract. The current default adult `HormoneSystem` satisfies this condition.\n\nThe immutable capture itself also accepts and exactly preserves valid developmental profiles whose baseline equals a source boundary, including newborn estrogen/testosterone at `0.0`. It does not invent an epsilon or widen `[0,1]`. Conversion of such a capture to the stricter merged v1 projection observation fails closed with `LegacyAffectCaptureError`; the detached source envelope remains valid.\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old_fail = '- any before/after source-state change.\n'
          new_fail = '- any before/after source-state change;\n- projection conversion when a preserved source baseline is not strictly interior to the merged v1 observation bounds.\n'
          assert text.count(old_fail) == 1
          text = text.replace(old_fail, new_fail)
          old_tests = '- exact 26-value M3-B observation bridge;\n'
          new_tests = '- exact 26-value M3-B observation bridge for the current default adult source;\n- exact preservation plus fail-closed bridge behavior for boundary-baseline developmental profiles;\n'
          assert text.count(old_tests) == 1
          text = text.replace(old_tests, new_tests)
          doc.write_text(text, encoding='utf-8')
          PY
      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr172-bounded-fix.yml
          git add core/m3_b_legacy_affect_capture.py tests/test_v4_m3_b_legacy_affect_capture.py docs/audit/M3_B_LEGACY_26_AXIS_IMMUTABLE_CAPTURE_CANDIDATE.md
          git commit -m "Harden legacy capture boundary handling"
          git push origin HEAD:codex/m3-b-legacy-26-axis-immutable-capture
