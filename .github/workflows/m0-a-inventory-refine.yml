name: Refine M0-A inventory precision

on:
  push:
    branches: [audit/m0-a-runtime-inventory]
    paths: [.github/workflows/m0-a-inventory-refine.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m0-a-runtime-inventory
          fetch-depth: 0
      - name: Separate in-memory mutation methods from external writes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/audit/m0_a_runtime_inventory.py')
          text = path.read_text(encoding='utf-8')

          old_methods = '''WRITE_METHOD_NAMES = {
    "append",
    "clear",
    "commit",
    "dump",
    "execute",
    "executemany",
    "flush",
    "insert",
    "mkdir",
    "persist",
    "remove",
    "rename",
    "replace",
    "rmdir",
    "save",
    "set",
    "touch",
    "unlink",
    "update",
    "write",
    "write_bytes",
    "write_text",
}
'''
          new_methods = '''WRITE_METHOD_NAMES = {
    "commit",
    "dump",
    "flush",
    "mkdir",
    "persist",
    "rename",
    "rmdir",
    "save",
    "touch",
    "unlink",
    "write",
    "write_bytes",
    "write_text",
}
DB_WRITE_METHOD_NAMES = {"execute", "executemany"}
DB_RECEIVER_HINTS = ("conn", "connection", "cursor", "database", "db", "sqlite")
MUTATION_METHOD_NAMES = {
    "add",
    "append",
    "clear",
    "discard",
    "extend",
    "insert",
    "pop",
    "popitem",
    "remove",
    "set",
    "setdefault",
    "update",
}
'''
          if text.count(old_methods) != 1:
              raise SystemExit(f'write-method block count={text.count(old_methods)}')
          text = text.replace(old_methods, new_methods, 1)

          old_visit = '''        else:
            leaf = target.rsplit(".", 1)[-1] if target else ""
            if leaf in WRITE_METHOD_NAMES:
                self.add(
                    "direct_write",
                    node,
                    f"write_like_method={target}",
                    "ast.Call write method heuristic",
                    details={"target": target},
                )

'''
          new_visit = '''        else:
            leaf = target.rsplit(".", 1)[-1] if target else ""
            receiver = target.rsplit(".", 1)[0].lower() if "." in target else ""
            db_write = leaf in DB_WRITE_METHOD_NAMES and any(
                hint in receiver for hint in DB_RECEIVER_HINTS
            )
            if leaf in WRITE_METHOD_NAMES or db_write:
                self.add(
                    "direct_write",
                    node,
                    f"write_like_method={target}",
                    "ast.Call write method heuristic",
                    details={"target": target, "database_receiver_match": db_write},
                )
            elif leaf in MUTATION_METHOD_NAMES:
                self.add(
                    "mutation",
                    node,
                    f"mutation_method={target}",
                    "ast.Call in-memory mutation method heuristic",
                    details={"target": target},
                )

'''
          if text.count(old_visit) != 1:
              raise SystemExit(f'visit-call block count={text.count(old_visit)}')
          path.write_text(text.replace(old_visit, new_visit, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/audit/m0_a_runtime_inventory.py
          git diff --check
          git diff -- scripts/audit/m0_a_runtime_inventory.py
      - name: Commit refined inventory detector
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/audit/m0_a_runtime_inventory.py
          git commit -m "Refine M0-A write and mutation detection"
          git push origin HEAD:audit/m0-a-runtime-inventory
