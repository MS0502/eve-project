name: Validate EVE M0-B audit

on:
  push:
    branches: [audit/m0-b-controlflow-concurrency]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare validation artifacts
        run: mkdir -p validation-artifacts

      - name: Install pinned markdown-strings compatibility package
        shell: bash
        run: |
          set -euo pipefail
          REPOSITORY=https://github.com/awesmubarak/markdown_strings.git
          TAG_SHA=$(git ls-remote "$REPOSITORY" refs/tags/3.4.0 | awk '{print $1}')
          test "${#TAG_SHA}" -eq 40
          printf '%s\n' "$TAG_SHA" | tee validation-artifacts/markdown-strings-tag-sha.txt
          python -m pip install --no-deps "git+${REPOSITORY}@${TAG_SHA}" \
            2>&1 | tee validation-artifacts/pip-bootstrap.txt
          python - <<'PY'
          import importlib.metadata
          version = importlib.metadata.version('markdown-strings')
          if version != '3.4.0':
              raise SystemExit(f'unexpected markdown-strings version: {version}')
          print(f'markdown-strings version={version}')
          PY

      - name: Install declared dependencies
        run: |
          set -o pipefail
          python -m pip install --retries 5 --timeout 60 -r requirements.txt \
            2>&1 | tee validation-artifacts/pip-install.txt
          python -m pip check 2>&1 | tee validation-artifacts/pip-check.txt

      - name: Compile audit surface
        run: |
          python -m py_compile scripts/audit/m0_b_controlflow_concurrency_inventory.py
          python -m py_compile tests/audit/test_m0_b_controlflow_concurrency_inventory.py

      - name: Generate ephemeral M0-B inventory
        run: |
          python scripts/audit/m0_b_controlflow_concurrency_inventory.py \
            --output validation-artifacts/m0-b-inventory.json
          python scripts/audit/m0_b_controlflow_concurrency_inventory.py \
            --summary-only | tee validation-artifacts/m0-b-summary.json

      - name: Run focused M0-B tests
        run: |
          python -m pytest -q tests/audit/test_m0_b_controlflow_concurrency_inventory.py \
            | tee validation-artifacts/focused-pytest.txt

      - name: Collect full suite
        run: |
          python -m pytest --collect-only -q \
            | tee validation-artifacts/collect-only.txt

      - name: Run full suite
        run: |
          python -m pytest -q | tee validation-artifacts/full-pytest.txt

      - name: Verify branch scope and generated state
        run: |
          git diff --check main...HEAD
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/m0-b-audit-validation.yml',
              'docs/audit/M0_B_GATE_FAILURE_CLOCK_CONCURRENCY_MAP.md',
              'docs/audit/M0_B_TEST_CLASSIFICATION.md',
              'scripts/audit/m0_b_controlflow_concurrency_inventory.py',
              'tests/audit/test_m0_b_controlflow_concurrency_inventory.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'main...HEAD'], text=True
          ).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected scope: {sorted(changed)}')
          if subprocess.check_output(['git', 'ls-files', 'validation-artifacts'], text=True).strip():
              raise SystemExit('validation artifacts are tracked')
          subprocess.check_call(['git', 'diff', '--exit-code'])
          subprocess.check_call(['git', 'diff', '--cached', '--exit-code'])
          PY

      - name: Upload M0-B validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eve-m0-b-validation
          path: validation-artifacts/*
          if-no-files-found: error
          retention-days: 30
