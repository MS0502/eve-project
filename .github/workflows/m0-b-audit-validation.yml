name: Validate EVE M0-B audit

on:
  push:
    branches: [audit/m0-b-controlflow-concurrency]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m0-b-controlflow-concurrency
          fetch-depth: 0

      - name: Refine M0-B detector once
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/audit/m0_b_controlflow_concurrency_inventory.py')
          text = script.read_text(encoding='utf-8')
          changed = False

          if '\nimport re\n' not in text:
              text = text.replace('\nimport os\n', '\nimport os\nimport re\n', 1)
              changed = True

          if 'MANUAL_OVERRIDES:' in text:
              start = text.index('MANUAL_OVERRIDES:')
              end = text.index('\n\n\ndef _node_end', start)
              manual = '''MANUAL_ENTRIES: tuple[dict[str, Any], ...] = (
              {
                  "category": "gate",
                  "path": "main.py",
                  "line_start": 22,
                  "line_end": 356,
                  "callable": "build_full_engine",
                  "mechanical_evidence": "M0-A confirmed runtime composition range",
                  "detector": "manual M0-B high-impact review",
                  "manual_classification": "ACTIVE_RUNTIME_COMPOSITION_GATE",
                  "manual_reason": "Optional capabilities and guarded model integration are composed in this callable.",
                  "confidence": "high",
                  "unresolved": False,
                  "manual_only": True,
              },
              {
                  "category": "output",
                  "path": "main.py",
                  "line_start": 374,
                  "line_end": 732,
                  "callable": "repl",
                  "mechanical_evidence": "M0-A confirmed interactive entrypoint range",
                  "detector": "manual M0-B high-impact review",
                  "manual_classification": "ACTIVE_INTERACTIVE_OUTPUT_SURFACE",
                  "manual_reason": "Operator commands and visible interactive responses converge in the REPL.",
                  "confidence": "high",
                  "unresolved": False,
                  "manual_only": True,
              },
              {
                  "category": "clock",
                  "path": "adapters/live_loop.py",
                  "line_start": 115,
                  "line_end": 203,
                  "callable": "LiveLoop._run",
                  "mechanical_evidence": "M0-A confirmed background loop range",
                  "detector": "manual M0-B high-impact review",
                  "manual_classification": "ACTIVE_BACKGROUND_CLOCK_DEPENDENCY",
                  "manual_reason": "The continuous loop is driven by elapsed time and delays.",
                  "confidence": "high",
                  "unresolved": False,
                  "manual_only": True,
              },
              {
                  "category": "concurrency",
                  "path": "adapters/live_loop.py",
                  "line_start": 214,
                  "line_end": 229,
                  "callable": "LiveLoop.start",
                  "mechanical_evidence": "M0-A confirmed daemon thread start range",
                  "detector": "manual M0-B high-impact review",
                  "manual_classification": "ACTIVE_DAEMON_THREAD_BOUNDARY",
                  "manual_reason": "This callable owns the live-loop daemon thread start boundary.",
                  "confidence": "high",
                  "unresolved": False,
                  "manual_only": True,
              },
              {
                  "category": "exception",
                  "path": "language/streaming.py",
                  "line_start": 177,
                  "line_end": 362,
                  "callable": "StreamingEngine.chat_stream",
                  "mechanical_evidence": "M0-A confirmed chat state-transition range",
                  "detector": "manual M0-B high-impact review",
                  "manual_classification": "ACTIVE_CHAT_FAILURE_HANDLING_PATH",
                  "manual_reason": "Failure handling inside the chat mutation funnel requires later manual disposition.",
                  "confidence": "high",
                  "unresolved": True,
                  "manual_only": True,
              },
              {
                  "category": "output",
                  "path": "core/autonomous.py",
                  "line_start": 68,
                  "line_end": 174,
                  "callable": "AutonomousLoop.step",
                  "mechanical_evidence": "M0-A confirmed autonomous transition range",
                  "detector": "manual M0-B high-impact review",
                  "manual_classification": "ACTIVE_AUTONOMOUS_OUTPUT_SURFACE",
                  "manual_reason": "Autonomous transitions may emit proactive speech or actions.",
                  "confidence": "high",
                  "unresolved": False,
                  "manual_only": True,
              },
          )'''
              text = text[:start] + manual + text[end:]
              changed = True

          override = '''    override = MANUAL_OVERRIDES.get((path, callable_name, category))
              if override is not None:
                  return override
          '''
          if override in text:
              text = text.replace(override, '', 1)
              changed = True

          old_bypass = '''        bypass_hits = {
              token for token in BYPASS_TOKENS if token in lower_target.replace("-", "_")
          }
          '''
          new_bypass = '''        target_tokens = set(
              re.findall(r"[a-z0-9]+", lower_target.replace("-", "_").replace(".", "_"))
          )
              bypass_hits = target_tokens & BYPASS_TOKENS
          '''
          if old_bypass in text:
              text = text.replace(old_bypass, new_bypass, 1)
              changed = True

          sort_marker = '    entries.sort(\n'
          manual_insertion = '''    available_paths = {path.relative_to(root).as_posix() for path in paths}
              entries.extend(
                  dict(entry)
                  for entry in MANUAL_ENTRIES
                  if entry["path"] in available_paths
              )

          '''
          if manual_insertion not in text:
              text = text.replace(sort_marker, manual_insertion + sort_marker, 1)
              changed = True

          if changed:
              script.write_text(text, encoding='utf-8')

          test_path = Path('tests/audit/test_m0_b_controlflow_concurrency_inventory.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_bypass_detection_uses_symbol_tokens'
          if marker not in tests:
              tests += '''\n\ndef test_bypass_detection_uses_symbol_tokens(tmp_path: Path):
              module = _load_module()
              (tmp_path / "runtime.py").write_text(
                  """def run(enforcement_rows, teacher, safety):\n"
                  "    enforcement_rows.append(1)\n"
                  "    teacher.reinforce_if_no_correction()\n"
                  "    safety.force_alternative()\n",
                  encoding="utf-8",
              )
              report = module.audit_repository(tmp_path)
              evidence = {
                  entry["mechanical_evidence"]
                  for entry in report["entries"]
                  if entry["category"] == "bypass"
              }
              assert "bypass_call=safety.force_alternative" in evidence
              assert "bypass_call=enforcement_rows.append" not in evidence
              assert "bypass_call=teacher.reinforce_if_no_correction" not in evidence
          '''
              test_path.write_text(tests, encoding='utf-8')

          PY
          python -m py_compile scripts/audit/m0_b_controlflow_concurrency_inventory.py
          python -m py_compile tests/audit/test_m0_b_controlflow_concurrency_inventory.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add scripts/audit/m0_b_controlflow_concurrency_inventory.py \
              tests/audit/test_m0_b_controlflow_concurrency_inventory.py
            git commit -m "Refine M0-B bypass and manual evidence classification"
            git push origin HEAD:audit/m0-b-controlflow-concurrency
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare validation artifacts
        run: mkdir -p validation-artifacts

      - name: Install pinned markdown-strings compatibility package
        shell: bash
        run: |
          set -euo pipefail
          REPOSITORY=https://github.com/awesmubarak/markdown_strings.git
          TAG_SHA=$(git ls-remote "$REPOSITORY" refs/tags/3.4.0 | awk '{print $1}')
          test "${#TAG_SHA}" -eq 40
          printf '%s\n' "$TAG_SHA" | tee validation-artifacts/markdown-strings-tag-sha.txt
          python -m pip install --no-deps "git+${REPOSITORY}@${TAG_SHA}" \
            2>&1 | tee validation-artifacts/pip-bootstrap.txt
          python - <<'PY'
          import importlib.metadata
          version = importlib.metadata.version('markdown-strings')
          if version != '3.4.0':
              raise SystemExit(f'unexpected markdown-strings version: {version}')
          print(f'markdown-strings version={version}')
          PY

      - name: Install declared dependencies
        run: |
          set -o pipefail
          python -m pip install --retries 5 --timeout 60 -r requirements.txt \
            2>&1 | tee validation-artifacts/pip-install.txt
          python -m pip check 2>&1 | tee validation-artifacts/pip-check.txt

      - name: Compile audit surface
        run: |
          python -m py_compile scripts/audit/m0_b_controlflow_concurrency_inventory.py
          python -m py_compile tests/audit/test_m0_b_controlflow_concurrency_inventory.py

      - name: Generate ephemeral M0-B inventory
        run: |
          python scripts/audit/m0_b_controlflow_concurrency_inventory.py \
            --output validation-artifacts/m0-b-inventory.json
          python scripts/audit/m0_b_controlflow_concurrency_inventory.py \
            --summary-only | tee validation-artifacts/m0-b-summary.json

      - name: Run focused M0-B tests
        run: |
          python -m pytest -q tests/audit/test_m0_b_controlflow_concurrency_inventory.py \
            | tee validation-artifacts/focused-pytest.txt

      - name: Collect full suite
        run: |
          python -m pytest --collect-only -q \
            | tee validation-artifacts/collect-only.txt

      - name: Run full suite
        run: |
          python -m pytest -q | tee validation-artifacts/full-pytest.txt

      - name: Verify branch scope and generated state
        run: |
          git diff --check origin/main...HEAD
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/m0-b-audit-validation.yml',
              'docs/audit/M0_B_GATE_FAILURE_CLOCK_CONCURRENCY_MAP.md',
              'docs/audit/M0_B_TEST_CLASSIFICATION.md',
              'scripts/audit/m0_b_controlflow_concurrency_inventory.py',
              'tests/audit/test_m0_b_controlflow_concurrency_inventory.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected scope: {sorted(changed)}')
          if subprocess.check_output(['git', 'ls-files', 'validation-artifacts'], text=True).strip():
              raise SystemExit('validation artifacts are tracked')
          subprocess.check_call(['git', 'diff', '--exit-code'])
          subprocess.check_call(['git', 'diff', '--cached', '--exit-code'])
          PY

      - name: Upload M0-B validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eve-m0-b-validation
          path: validation-artifacts/*
          if-no-files-found: error
          retention-days: 30
