name: M2-B corrected staging validation

on:
  pull_request:
    branches: [codex/m2b-boundary-probe-base]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/m2b-corrected-staging
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct corrected patch and generator
        run: |
          git fetch origin codex/m2b-boundary-probe
          mkdir -p /tmp/m2b
          {
            for part in aa ab ac ad; do
              git show "origin/codex/m2b-boundary-probe:scripts/audit/_tmp_m2b_chunks/patch.${part}"
            done
            for part in 00 01 02 03; do
              git show "origin/codex/m2b-boundary-probe:scripts/audit/_tmp_m2b_chunks/patch.ae.${part}"
            done
            git show "origin/codex/m2b-boundary-probe:scripts/audit/_tmp_m2b_chunks/patch.af.00"
          } | base64 -d > /tmp/m2b/corrected.patch
          {
            for prefix in aa ab ac; do
              for part in 00 01 02 03; do
                git show "origin/codex/m2b-boundary-probe:scripts/audit/_tmp_m2b_chunks/gen.${prefix}.${part}"
              done
            done
          } | base64 -d > /tmp/m2b/generate.py
          echo "972ac4bf8496b2087ab4cdcc650c707c91edda8f5a577841e11a781e5512cca0  /tmp/m2b/corrected.patch" | sha256sum -c -
          echo "c76f9a21c5fed547cac049a4d9721fc73d6d6dc25b381c3f72ce58b3e3c70523  /tmp/m2b/generate.py" | sha256sum -c -

      - name: Apply corrected patch
        run: |
          git apply --check --verbose /tmp/m2b/corrected.patch
          git apply /tmp/m2b/corrected.patch
          git diff --stat | tee /tmp/patch-stat.txt

      - name: Regenerate exact evidence
        run: |
          set +e
          PYTHONPATH="$PWD" python /tmp/m2b/generate.py > /tmp/m2b-generation.log 2>&1
          status=$?
          cat /tmp/m2b-generation.log
          exit $status

      - name: Focused validation only
        run: |
          python -m pytest -q --tb=short \
            tests/audit/test_forward_regression_bundle.py \
            tests/audit/test_m2_b_decision_groups.py \
            tests/audit/test_m2_b_read_capability_manifest.py | tee /tmp/focused.txt
          python scripts/audit/m2_b_decision_groups.py \
            --candidate /tmp/m2-b-read-capability-candidates.json \
            --decisions docs/audit/M2_B_READ_CAPABILITY_DECISION_GROUPS.json \
            --output /tmp/m2-b-decision-validation.json --pretty --strict
          python scripts/audit/forward_regression_bundle.py \
            --output /tmp/forward-regression.json --pretty \
            --current-pr 162 \
            --base-sha 2577346d0a95eafa0456c4f6816d25c37edf95a2
          cat /tmp/m2-b-decision-validation.json
          cat /tmp/forward-regression.json

      - name: Commit corrected staging head
        run: |
          git config user.name "openai-codex[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/audit/m2_b_read_capability_manifest.py \
            scripts/audit/m2_b_decision_groups.py \
            tests/audit/test_m2_b_read_capability_manifest.py \
            tests/audit/test_m2_b_decision_groups.py \
            docs/audit/M2_B_READ_CAPABILITY_REVIEW.md \
            docs/audit/M2_B_READ_CAPABILITY_DECISION_GROUPS.json \
            docs/audit/forward_additions/pr-162.json \
            docs/audit/forward_additions/pr-162-decision-groups.json
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git commit -m "Correct M2-B taint and unresolved coverage"
          git push origin HEAD:codex/m2b-corrected-staging
          git rev-parse HEAD | tee /tmp/staging-head.txt

      - name: Upload staging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2b-corrected-staging-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/m2b/corrected.patch
            /tmp/m2b/generate.py
            /tmp/patch-stat.txt
            /tmp/m2b-generation.log
            /tmp/focused.txt
            /tmp/m2-b-read-capability-candidates.json
            /tmp/m2-b-decision-validation.json
            /tmp/forward-regression.json
            /tmp/staging-head.txt
          if-no-files-found: warn
          retention-days: 7
