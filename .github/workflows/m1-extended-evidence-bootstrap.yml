name: M1 extended evidence bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  bootstrap:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'm1/extended-controlled-observation-window'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify bootstrap coordinates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$BASE_SHA" = "847621bcd61634958ce505108ade491c50ced0d4"
          test -z "$(git status --short)"

      - name: Install declared dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          import sys
          import urllib.request

          url = 'https://files.pythonhosted.org/packages/72/d2/ef65d0f3c150bfc99f5c4a516ae57e7c3acddfaacc1196dd296b1299ea7f/markdown_strings-3.4.0.tar.gz'
          expected = '7574de0606160d7291ac2e1933a8ed47d31f0b49b674f128da1f548930c8578b'
          target = pathlib.Path('/tmp/markdown_strings-3.4.0.tar.gz')
          urllib.request.urlretrieve(url, target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == expected
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(target)])
          PY
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Generate canonical raw observations and report
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit/m1_extended_controlled_observation_campaign.py \
            --raw-output docs/audit/M1_EXTENDED_CONTROLLED_OBSERVATION_RAW.json \
            --evidence-output docs/audit/M1_EXTENDED_CONTROLLED_OBSERVATION_EVIDENCE.md
          python -m compileall -q \
            scripts/audit/m1_extended_controlled_observation_campaign.py \
            tests/test_v4_m1_extended_controlled_observation_campaign.py

      - name: Register exact forward additions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit/forward_regression_gate.py \
            --report-only \
            --pretty \
            --output /tmp/forward-before-registration.json
          python - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          manifest_path = Path('docs/audit/FORWARD_ADDITIONS_MANIFEST.json')
          report = json.loads(Path('/tmp/forward-before-registration.json').read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          current_pr = int(os.environ['CURRENT_PR'])
          expected_paths = {
              'scripts/audit/m1_extended_controlled_observation_campaign.py',
              'tests/test_v4_m1_extended_controlled_observation_campaign.py',
          }
          rows = report['unregistered_additions']
          actual_paths = {row['path'] for row in rows}
          if not rows or actual_paths != expected_paths:
              raise SystemExit(
                  f'unexpected unregistered paths: expected={sorted(expected_paths)} actual={sorted(actual_paths)}'
              )
          grouped = collections.defaultdict(list)
          for row in rows:
              grouped[row['path']].append(row)
          metadata = {
              'scripts/audit/m1_extended_controlled_observation_campaign.py': {
                  'rationale': (
                      'Expanded disconnected M1 mechanism observation covering reviewed '
                      'WRAP/REWRITE paths, all required mutation forms, a live tick-thread '
                      'probe, deterministic replay, failure visibility, and canonical raw evidence.'
                  ),
                  'owner': 'M1 extended controlled observation evidence',
                  'disposition': 'M1_EXTENDED_CONTROLLED_EVIDENCE',
              },
              'tests/test_v4_m1_extended_controlled_observation_campaign.py': {
                  'rationale': (
                      'Focused fail-closed verification and independent metric recomputation '
                      'for the extended controlled M1 observation artifact.'
                  ),
                  'owner': 'M1 extended controlled observation verification',
                  'disposition': 'TEST_EVIDENCE',
              },
          }
          additions = []
          for path in sorted(grouped):
              values = grouped[path]
              additions.append(
                  {
                      'path': path,
                      'categories': sorted({row['category'] for row in values}),
                      'symbols': sorted({row['symbol'] for row in values}),
                      **metadata[path],
                      'introduced_by_pr': current_pr,
                      'fingerprints': {
                          row['fingerprint']: int(row['count'])
                          for row in sorted(values, key=lambda item: item['fingerprint'])
                      },
                  }
              )
          manifest['registered_addition_groups'].extend(additions)
          manifest_path.write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(',', ':'),
              ) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Verify generated evidence and forward gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            tests/test_v4_m1_extended_controlled_observation_campaign.py
          python scripts/audit/forward_regression_gate.py \
            --current-pr "$CURRENT_PR" \
            --base-sha "$BASE_SHA" \
            --pretty \
            --output /tmp/forward-after-registration.json
          cat /tmp/forward-after-registration.json

      - name: Commit generated evidence and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/m1-extended-evidence-bootstrap.yml
          git add \
            docs/audit/FORWARD_ADDITIONS_MANIFEST.json \
            docs/audit/M1_EXTENDED_CONTROLLED_OBSERVATION_RAW.json \
            docs/audit/M1_EXTENDED_CONTROLLED_OBSERVATION_EVIDENCE.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Generate extended M1 observation evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
