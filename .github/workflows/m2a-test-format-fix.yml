name: Temporary M2-A test format fix

on:
  push:
    branches: [codex/m2-a-sqlite-shadow-persistence]

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'MS0502/eve-project'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/m2-a-sqlite-shadow-persistence
          fetch-depth: 0

      - name: Fix test formatting and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          path = root / "tests/test_v4_m2_a_sqlite_shadow_store.py"
          text = path.read_text(encoding="utf-8")
          old = '''        store.restore_verified(
            stream_id="shadow:test",
            initial_state=State(0),
            reducer=reduce_state,
            state_to_mapping=lambda state: {"total": state.total},
            state_from_mapping=lambda value: State(int(value["total"])),
        )
'''
          # The generated file may contain two-space argument indentation.
          malformed = '''        store.restore_verified(
  stream_id="shadow:test",
  initial_state=State(0),
  reducer=reduce_state,
  state_to_mapping=lambda state: {"total": state.total},
  state_from_mapping=lambda value: State(int(value["total"])),
        )
'''
          if text.count(malformed) != 1:
              raise SystemExit("unexpected filtered-read test formatting")
          path.write_text(text.replace(malformed, old), encoding="utf-8")
          (root / ".github/workflows/m2a-test-format-fix.yml").unlink()
          PY

      - name: Commit formatting fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_v4_m2_a_sqlite_shadow_store.py .github/workflows/m2a-test-format-fix.yml
          git commit -m "Format M2-A filtered-read regression test"
          git push origin HEAD:codex/m2-a-sqlite-shadow-persistence
