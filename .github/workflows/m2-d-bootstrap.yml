name: M2-D one-shot bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/m2-d-recovery-rehearsal
          fetch-depth: 0
      - name: Verify compressed package
        shell: bash
        run: |
          set -euo pipefail
          cat .m2d-payload/part-* > /tmp/m2d-payload.b64
          base64 --decode /tmp/m2d-payload.b64 > /tmp/m2d-payload.tar.gz
          actual="$(sha256sum /tmp/m2d-payload.tar.gz | cut -d' ' -f1)"
          echo "payload_sha256=$actual"
          test "$actual" = '85b5ea378018bc9717dfa8fa21acdb8799637d5905769da6e004fd1eebe5eac1'
      - name: Extract reviewed non-workflow package
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/m2d-payload.tar.gz
          test -f core/m2_d_rehearsal.py
          test -f scripts/audit/m2_d_rehearsal.py
          test -f tests/test_v4_m2_d_rehearsal.py
          test -f docs/audit/M2_D_RECOVERY_REHEARSAL_CANDIDATE.md
          git restore .github/workflows/exact-head-validation.yml
          rm -rf .m2d-payload
      - name: Commit materialized non-workflow package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/m2_d_rehearsal.py
          git add scripts/audit/m2_d_rehearsal.py
          git add tests/test_v4_m2_d_rehearsal.py
          git add docs/audit/M2_D_RECOVERY_REHEARSAL_CANDIDATE.md
          git add -u .m2d-payload
          git status --short
          git commit -m 'M2-D: add bounded recovery rehearsal candidate'
          git push origin HEAD:codex/m2-d-recovery-rehearsal
