name: Refresh EVE M0-D validation metrics once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eve-m0-d-disposition-audit
          fetch-depth: 0

      - name: Replace validation metrics in both M0-D documents
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('docs/audit/M0_D_NEURAL_VECTOR_LIFELOOP_INVENTORY.md'),
              Path('docs/audit/M0_D_MODULE_DISPOSITION.md'),
          ]
          replacements = {
              'focused M0-D tests: 11 passed in 42.37s': 'focused M0-D tests: 12 passed in 25.12s',
              'collection: 2,584 tests collected in 5.16s': 'collection: 2,585 tests collected in 3.01s',
              'full suite: 2,584 passed in 84.66s': 'full suite: 2,585 passed in 50.14s',
              'Validation run `29680010246`, artifact `eve-m0-d-validation`, SHA-256 `7aca00e64dd30151044131f1726dfa28461ea7ae99698bcf7a789fe09f36c9d1`.': 'Validation run `29680825833`, artifact `eve-m0-d-validation`, SHA-256 `c9fbec7a0635173b487ab15cc712d73f5509bd7fb63dfbee85adfa2db1ee21f3`.',
          }
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f'missing validation metric in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/audit/M0_D_NEURAL_VECTOR_LIFELOOP_INVENTORY.md \
            docs/audit/M0_D_MODULE_DISPOSITION.md
          git commit -m "Refresh validated M0-D evidence metrics"
          git push origin HEAD:claude/eve-m0-d-disposition-audit
