name: Validate EVE M0-C audit

on:
  push:
    branches: [audit/m0-c-persistence-state]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/m0-c-persistence-state
          fetch-depth: 0

      - name: Refine M0-C persistence directory evidence once
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/audit/m0_c_persistence_state_inventory.py')
          text = script.read_text(encoding='utf-8')
          changed = False
          old = '''def _path_like(value: str) -> bool:
              candidate = value.strip()
              if not candidate or len(candidate) > 512:
                  return False
              if "\\n" in candidate or "\\r" in candidate:
                  return False
              if _format_for_path(candidate) is not None:
                  return True
              if candidate in {"/", "\\\\"} or "://" in candidate:
                  return False
              if any(character.isspace() for character in candidate):
                  return False
              if candidate.startswith(("~/", "./", "../", "/")):
                  return True
              return "/" in candidate or "\\\\" in candidate
          '''
          new = '''def _path_like(value: str) -> bool:
              candidate = value.strip()
              if not candidate or len(candidate) > 512:
                  return False
              if "\\n" in candidate or "\\r" in candidate:
                  return False
              if _format_for_path(candidate) is not None:
                  return True
              if candidate in {"/", "\\\\"} or "://" in candidate:
                  return False
              if any(character.isspace() for character in candidate):
                  return False
              if "/" not in candidate and "\\\\" not in candidate:
                  return False
              persistence_path_tokens = {
                  "artifact",
                  "artifacts",
                  "autosave",
                  "cache",
                  "checkpoint",
                  "checkpoints",
                  "ckpt",
                  "database",
                  "db",
                  "debug",
                  "embedding",
                  "embeddings",
                  "export",
                  "manifest",
                  "memory",
                  "model",
                  "operator",
                  "report",
                  "seed",
                  "seeds",
                  "sidecar",
                  "snapshot",
                  "state",
                  "store",
                  "subset",
                  "validation",
                  "vector",
                  "vectors",
                  "vocab",
                  "vocabulary",
              }
              return bool(_symbol_tokens(candidate) & persistence_path_tokens)
          '''
          if old in text:
              text = text.replace(old, new, 1)
              changed = True
          elif 'persistence_path_tokens = {' not in text:
              raise SystemExit('refined M0-C path predicate anchor not found')
          if changed:
              script.write_text(text, encoding='utf-8')

          test_path = Path('tests/audit/test_m0_c_persistence_state_inventory.py')
          tests = test_path.read_text(encoding='utf-8')
          if 'def test_path_like_requires_persistence_directory_markers' not in tests:
              tests += '''\n\ndef test_path_like_requires_persistence_directory_markers():
              module = _load_module()
              assert module._path_like("_operator_artifacts/run") is True
              assert module._path_like("seeds/subsets") is True
              assert module._path_like("state/checkpoints/current") is True
              assert module._path_like("/save") is False
              assert module._path_like("language/streaming") is False
              assert module._path_like("tests/test_file.py::test_case") is False
              assert module._path_like(r"^foo\\s+/bar$") is False
              assert module._path_like("/nonexistent.wav") is False
          '''
              test_path.write_text(tests, encoding='utf-8')
          PY
          python -m py_compile scripts/audit/m0_c_persistence_state_inventory.py
          python -m py_compile tests/audit/test_m0_c_persistence_state_inventory.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add scripts/audit/m0_c_persistence_state_inventory.py \
              tests/audit/test_m0_c_persistence_state_inventory.py
            git commit -m "Refine M0-C persistence directory evidence"
            git push origin HEAD:audit/m0-c-persistence-state
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare validation artifacts
        run: mkdir -p validation-artifacts

      - name: Install pinned markdown-strings compatibility package
        run: |
          set -o pipefail
          python -m pip install --no-deps \
            'git+https://github.com/awesmubarak/markdown_strings.git@9834a3f3cc13bd1e028756949c96bb54d573e7cf' \
            2>&1 | tee validation-artifacts/pip-bootstrap.txt
          python - <<'PY'
          import importlib.metadata
          version = importlib.metadata.version('markdown-strings')
          if version != '3.4.0':
              raise SystemExit(f'unexpected markdown-strings version: {version}')
          print(f'markdown-strings version={version}')
          PY

      - name: Install declared dependencies
        run: |
          set -o pipefail
          python -m pip install --retries 5 --timeout 60 -r requirements.txt \
            2>&1 | tee validation-artifacts/pip-install.txt
          python -m pip check 2>&1 | tee validation-artifacts/pip-check.txt

      - name: Compile audit surface
        run: |
          python -m py_compile scripts/audit/m0_c_persistence_state_inventory.py
          python -m py_compile tests/audit/test_m0_c_persistence_state_inventory.py

      - name: Generate ephemeral M0-C inventory
        run: |
          python scripts/audit/m0_c_persistence_state_inventory.py \
            --output validation-artifacts/m0-c-inventory.json
          python scripts/audit/m0_c_persistence_state_inventory.py \
            --summary-only | tee validation-artifacts/m0-c-summary.json

      - name: Run focused M0-C tests
        run: |
          set -o pipefail
          python -m pytest -q tests/audit/test_m0_c_persistence_state_inventory.py \
            | tee validation-artifacts/focused-pytest.txt

      - name: Collect full suite
        run: |
          set -o pipefail
          python -m pytest --collect-only -q \
            | tee validation-artifacts/collect-only.txt

      - name: Run full suite
        run: |
          set -o pipefail
          python -m pytest -q | tee validation-artifacts/full-pytest.txt

      - name: Verify branch scope and generated state
        run: |
          git diff --check origin/main...HEAD
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/m0-c-audit-validation.yml',
              'docs/audit/M0_C_PERSISTENCE_AND_STATE_MAP.md',
              'docs/audit/M0_C_TEST_CLASSIFICATION.md',
              'scripts/audit/m0_c_persistence_state_inventory.py',
              'tests/audit/test_m0_c_persistence_state_inventory.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected scope: {sorted(changed)}')
          if subprocess.check_output(['git', 'ls-files', 'validation-artifacts'], text=True).strip():
              raise SystemExit('validation artifacts are tracked')
          subprocess.check_call(['git', 'diff', '--exit-code'])
          subprocess.check_call(['git', 'diff', '--cached', '--exit-code'])
          PY

      - name: Upload M0-C validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eve-m0-c-validation
          path: validation-artifacts/*
          if-no-files-found: error
          retention-days: 30
