name: Validate final M0 cleanup and audit snapshot pins

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate-cleanup:
    if: github.event.pull_request.head.ref == 'validation/cleanup-m0-temp-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: cleanup/remove-temporary-m0-validation-files
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Verify exact cleanup head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$TARGET_BRANCH)"
          test -z "$(git status --short)"
          git show origin/main:scripts/tmp_install_m0_c_validation_dependency.py > /tmp/install.py
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/install.py
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify exact five-file deletion scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' .github/workflows/resolve-validate-m0-c-affect-plan.yml scripts/tmp_apply_m0_c_affect_plan_rulings.py scripts/tmp_apply_m0_d_baseline_scope.py scripts/tmp_install_m0_c_validation_dependency.py scripts/tmp_validate_m0_c_affect_plan.py | sort)"
          test "$changed" = "$expected"
          while IFS= read -r path; do test ! -e "$path"; done <<< "$expected"
          git diff --check origin/main...HEAD
          test -z "$(git status --short)"
          printf '%s\n' "$changed" > /tmp/scope.txt
      - name: Collect full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q | tee /tmp/collect.txt
      - name: Run full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q | tee /tmp/full.txt
      - name: Record exact validated head
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/final-head.txt
          test -z "$(git status --short)"
      - uses: actions/upload-artifact@v4
        with:
          name: m0-temporary-file-cleanup-validation
          path: |
            /tmp/scope.txt
            /tmp/collect.txt
            /tmp/full.txt
            /tmp/final-head.txt
          if-no-files-found: error

  validate-audit-snapshot-pins:
    if: github.event.pull_request.head.ref == 'validation/m0-abc-universe-pin-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: fix/m0-abc-audit-snapshot-pins
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Verify exact correction base and load helpers
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$TARGET_BRANCH)"
          test -z "$(git status --short)"
          git rev-parse HEAD > /tmp/base-head.txt
          git show origin/main:scripts/tmp_apply_m0_d_baseline_scope.py > /tmp/apply.py
          git show origin/main:scripts/tmp_install_m0_c_validation_dependency.py > /tmp/install.py
      - name: Apply and locally commit snapshot pins
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/audit/M0_A_RUNTIME_ENTRYPOINT_AND_MUTATION_MAP.md docs/audit/M0_B_GATE_FAILURE_CLOCK_CONCURRENCY_MAP.md docs/audit/M0_C_PERSISTENCE_AND_STATE_MAP.md scripts/audit/m0_a_runtime_inventory.py scripts/audit/m0_b_controlflow_concurrency_inventory.py scripts/audit/m0_c_persistence_state_inventory.py tests/audit/test_m0_a_runtime_inventory.py tests/audit/test_m0_b_controlflow_concurrency_inventory.py tests/audit/test_m0_c_persistence_state_inventory.py | sort)"
          test "$changed" = "$expected"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $changed
          git commit -m "Pin M0-A B C audits to merged snapshots"
          test -z "$(git status --short)"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/install.py
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile and reproduce canonical audits
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts/audit/m0_a_runtime_inventory.py scripts/audit/m0_b_controlflow_concurrency_inventory.py scripts/audit/m0_c_persistence_state_inventory.py tests/audit/test_m0_a_runtime_inventory.py tests/audit/test_m0_b_controlflow_concurrency_inventory.py tests/audit/test_m0_c_persistence_state_inventory.py
          for name in a b c; do
            case "$name" in
              a) script=scripts/audit/m0_a_runtime_inventory.py ;;
              b) script=scripts/audit/m0_b_controlflow_concurrency_inventory.py ;;
              c) script=scripts/audit/m0_c_persistence_state_inventory.py ;;
            esac
            python "$script" --output "/tmp/m0-${name}-1.json"
            python "$script" --output "/tmp/m0-${name}-2.json"
            diff -u "/tmp/m0-${name}-1.json" "/tmp/m0-${name}-2.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('/tmp/m0-a-1.json').read_text(encoding='utf-8'))['summary']
          b = json.loads(Path('/tmp/m0-b-1.json').read_text(encoding='utf-8'))['summary']
          c = json.loads(Path('/tmp/m0-c-1.json').read_text(encoding='utf-8'))['summary']
          assert (a['python_files_scanned'], a['entries']) == (578, 13341), a
          assert (b['python_files_scanned'], b['total_entries']) == (580, 4063), b
          assert (c['python_files_scanned'], c['total_entries']) == (582, 7669), c
          PY
      - name: Run focused audit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/audit/test_m0_a_runtime_inventory.py tests/audit/test_m0_b_controlflow_concurrency_inventory.py tests/audit/test_m0_c_persistence_state_inventory.py | tee /tmp/focused.txt
      - name: Collect full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q | tee /tmp/collect.txt
      - name: Run full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q | tee /tmp/full.txt
      - name: Verify exact scope and push validated correction
        shell: bash
        run: |
          set -euo pipefail
          base="$(cat /tmp/base-head.txt)"
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' docs/audit/M0_A_RUNTIME_ENTRYPOINT_AND_MUTATION_MAP.md docs/audit/M0_B_GATE_FAILURE_CLOCK_CONCURRENCY_MAP.md docs/audit/M0_C_PERSISTENCE_AND_STATE_MAP.md scripts/audit/m0_a_runtime_inventory.py scripts/audit/m0_b_controlflow_concurrency_inventory.py scripts/audit/m0_c_persistence_state_inventory.py tests/audit/test_m0_a_runtime_inventory.py tests/audit/test_m0_b_controlflow_concurrency_inventory.py tests/audit/test_m0_c_persistence_state_inventory.py | sort)"
          test "$changed" = "$expected"
          test -z "$(git status --short)"
          printf '%s\n' "$changed" > /tmp/scope.txt
          git rev-parse HEAD | tee /tmp/final-head.txt
          git push origin HEAD:"$TARGET_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: m0-abc-audit-snapshot-pin-validation
          path: |
            /tmp/m0-a-1.json
            /tmp/m0-a-2.json
            /tmp/m0-b-1.json
            /tmp/m0-b-2.json
            /tmp/m0-c-1.json
            /tmp/m0-c-2.json
            /tmp/focused.txt
            /tmp/collect.txt
            /tmp/full.txt
            /tmp/scope.txt
            /tmp/final-head.txt
          if-no-files-found: error
