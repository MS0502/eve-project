name: Validate M0-D baseline path scope

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'validation/m0-d-baseline-scope-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: 223c680cb404ebec305fda39825a80616ceccbc5
      TARGET_BRANCH: fix/m0-d-baseline-path-scope
      GH_TOKEN: ${{ github.token }}
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Verify and load helpers
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"
          git fetch origin main
          git show origin/main:scripts/tmp_apply_m0_d_baseline_scope.py > /tmp/apply.py
          git show origin/main:scripts/tmp_install_m0_c_validation_dependency.py > /tmp/install_compat.py
      - name: Apply and locally commit baseline-scope correction
        run: |
          python /tmp/apply.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/audit/M0_D_NEURAL_VECTOR_LIFELOOP_INVENTORY.md scripts/audit/m0_d_component_inventory.py tests/audit/test_m0_d_component_inventory.py | sort)"
          test "$changed" = "$expected"
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/audit/M0_D_NEURAL_VECTOR_LIFELOOP_INVENTORY.md scripts/audit/m0_d_component_inventory.py tests/audit/test_m0_d_component_inventory.py
          git commit -m "Pin M0-D Python path scope to audit baseline"
          test -z "$(git status --short)"
      - name: Install dependencies
        run: |
          python /tmp/install_compat.py
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile and deterministic audit
        run: |
          python -m compileall -q scripts/audit/m0_d_component_inventory.py tests/audit/test_m0_d_component_inventory.py
          python scripts/audit/m0_d_component_inventory.py --output /tmp/m0-d-1.json
          python scripts/audit/m0_d_component_inventory.py --output /tmp/m0-d-2.json
          diff -u /tmp/m0-d-1.json /tmp/m0-d-2.json
      - name: Run focused M0-D tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/audit/test_m0_d_component_inventory.py | tee /tmp/focused.txt
      - name: Collect full suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --collect-only -q | tee /tmp/collect.txt
      - name: Run full suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/full.txt
      - name: Verify exact committed correction scope
        run: |
          changed="$(git diff --name-only "$EXPECTED_HEAD"...HEAD | sort)"
          expected="$(printf '%s\n' docs/audit/M0_D_NEURAL_VECTOR_LIFELOOP_INVENTORY.md scripts/audit/m0_d_component_inventory.py tests/audit/test_m0_d_component_inventory.py | sort)"
          test "$changed" = "$expected"
          test -z "$(git status --short)"
          git rev-parse HEAD | tee /tmp/final-head.txt
      - name: Push validated correction
        run: git push origin HEAD:"$TARGET_BRANCH"
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: m0-d-baseline-path-scope-validation
          path: |
            /tmp/m0-d-1.json
            /tmp/m0-d-2.json
            /tmp/focused.txt
            /tmp/collect.txt
            /tmp/full.txt
            /tmp/final-head.txt
          if-no-files-found: error
