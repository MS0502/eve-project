name: Resolve and validate M0-C affect plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resolve-validate:
    if: github.event.pull_request.head.ref == 'validation/m0-c-affect-plan-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: f1f58ecf929287ca46273078baf8e09537455cdc
      TARGET_BRANCH: claude/eve-m0-c-affect-migration-plan
      GH_TOKEN: ${{ github.token }}
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Verify and load temporary validators
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --short)"
          git fetch origin main
          git show origin/main:scripts/tmp_apply_m0_c_affect_plan_rulings.py > /tmp/apply.py
          git show origin/main:scripts/tmp_validate_m0_c_affect_plan.py > /tmp/validate.py
      - name: Apply reviewer rulings
        run: python /tmp/apply.py
      - name: Validate exact working tree
        run: python /tmp/validate.py
      - name: Commit reviewer rulings
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/EVE_IMPLEMENTATION_STATUS_v4.md docs/audit/M0_C_AFFECT_MIGRATION_PLAN.md
          git commit -m "Apply reviewer rulings to affect migration plan"
          git push origin HEAD:"$TARGET_BRANCH"
          git rev-parse HEAD | tee /tmp/final-head.txt
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: m0-c-affect-migration-plan-validation
          path: |
            /tmp/affect-plan-1.json
            /tmp/affect-plan-2.json
            /tmp/summary.json
            /tmp/focused.txt
            /tmp/collect.txt
            /tmp/full.txt
            /tmp/validation-result.json
            /tmp/final-head.txt
          if-no-files-found: error
      - name: Publish result comment
        run: |
          head="$(cat /tmp/final-head.txt)"
          summary="$(cat /tmp/summary.json)"
          gh pr comment 132 --repo MS0502/eve-project --body "Reviewer rulings applied and exact working-tree validation passed.\n\nFinal head: \`$head\`\nWorkflow run: \`${{ github.run_id }}\`\nArtifact: \`m0-c-affect-migration-plan-validation\`\n\nSummary: \`$summary\`"
