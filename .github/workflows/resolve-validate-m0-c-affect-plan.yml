name: Validate final M0 cleanup and audit snapshot pins

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate-cleanup:
    if: github.event.pull_request.head.ref == 'validation/cleanup-m0-temp-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: cleanup/remove-temporary-m0-validation-files
      GH_TOKEN: ${{ github.token }}
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout exact cleanup head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Verify exact remote head and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$TARGET_BRANCH)"
          test -z "$(git status --short)"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          import sys
          import urllib.request
          url = 'https://files.pythonhosted.org/packages/72/d2/ef65d0f3c150bfc99f5c4a516ae57e7c3acddfaacc1196dd296b1299ea7f/markdown_strings-3.4.0.tar.gz'
          expected = '7574de0606160d7291ac2e1933a8ed47d31f0b49b674f128da1f548930c8578b'
          target = pathlib.Path('/tmp/markdown_strings-3.4.0.tar.gz')
          urllib.request.urlretrieve(url, target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == expected
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(target)])
          PY
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify exact five-file deletion scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/resolve-validate-m0-c-affect-plan.yml \
            scripts/tmp_apply_m0_c_affect_plan_rulings.py \
            scripts/tmp_apply_m0_d_baseline_scope.py \
            scripts/tmp_install_m0_c_validation_dependency.py \
            scripts/tmp_validate_m0_c_affect_plan.py | sort)"
          test "$changed" = "$expected"
          for path in \
            .github/workflows/resolve-validate-m0-c-affect-plan.yml \
            scripts/tmp_apply_m0_c_affect_plan_rulings.py \
            scripts/tmp_apply_m0_d_baseline_scope.py \
            scripts/tmp_install_m0_c_validation_dependency.py \
            scripts/tmp_validate_m0_c_affect_plan.py; do
            test ! -e "$path"
          done
          git diff --check origin/main...HEAD
          test -z "$(git status --short)"
          printf '%s\n' "$changed" > /tmp/scope.txt
      - name: Collect full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q | tee /tmp/collect.txt
      - name: Run full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q | tee /tmp/full.txt
      - name: Record exact validated head
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/final-head.txt
          test -z "$(git status --short)"
      - name: Upload cleanup evidence
        uses: actions/upload-artifact@v4
        with:
          name: m0-temporary-file-cleanup-validation
          path: |
            /tmp/scope.txt
            /tmp/collect.txt
            /tmp/full.txt
            /tmp/final-head.txt
          if-no-files-found: error
      - name: Publish cleanup result
        shell: bash
        run: |
          set -euo pipefail
          head="$(cat /tmp/final-head.txt)"
          collect="$(tail -n 1 /tmp/collect.txt)"
          full="$(tail -n 1 /tmp/full.txt)"
          gh pr comment 137 --repo MS0502/eve-project --body "Exact cleanup validation passed.\n\nValidated head:\n\n\`\`\`text\n${head}\n\`\`\`\n\nCollection: \`${collect}\`\nFull suite: \`${full}\`\nWorkflow run: \`${{ github.run_id }}\`\nArtifact: \`m0-temporary-file-cleanup-validation\`"

  validate-audit-snapshot-pins:
    if: github.event.pull_request.head.ref == 'validation/m0-abc-universe-pin-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: fix/m0-abc-audit-snapshot-pins
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout exact correction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Verify exact remote head and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$TARGET_BRANCH)"
          test -z "$(git status --short)"
          git rev-parse HEAD > /tmp/base-head.txt
      - name: Apply A B C audit snapshot pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          configs = [
              {
                  'script': Path('scripts/audit/m0_a_runtime_inventory.py'),
                  'test': Path('tests/audit/test_m0_a_runtime_inventory.py'),
                  'doc': Path('docs/audit/M0_A_RUNTIME_ENTRYPOINT_AND_MUTATION_MAP.md'),
                  'schema': 'SCHEMA_VERSION = "1.0.0-m0-a"',
                  'snapshot': '78544d74af84afed450014d599b360c9b4af4f03',
                  'expected': 578,
                  'label': 'M0-A',
              },
              {
                  'script': Path('scripts/audit/m0_b_controlflow_concurrency_inventory.py'),
                  'test': Path('tests/audit/test_m0_b_controlflow_concurrency_inventory.py'),
                  'doc': Path('docs/audit/M0_B_GATE_FAILURE_CLOCK_CONCURRENCY_MAP.md'),
                  'schema': 'SCHEMA_VERSION = "1.0.0-m0-b"',
                  'snapshot': 'eea70c286e947cbc180db9565bfa5ddc062d1ac3',
                  'expected': 580,
                  'label': 'M0-B',
              },
              {
                  'script': Path('scripts/audit/m0_c_persistence_state_inventory.py'),
                  'test': Path('tests/audit/test_m0_c_persistence_state_inventory.py'),
                  'doc': Path('docs/audit/M0_C_PERSISTENCE_AND_STATE_MAP.md'),
                  'schema': 'SCHEMA_VERSION = "1.0.0-m0-c"',
                  'snapshot': 'fe10cd954bdf445400ea6aa9708dd214ed761114',
                  'expected': 582,
                  'label': 'M0-C',
              },
          ]

          old_git = '''def _git_tracked_python_files(root: Path) -> list[Path]:
              try:
                  raw = subprocess.check_output(
                      ["git", "-C", str(root), "ls-files", "-z", "--", "*.py"],
                      stderr=subprocess.DEVNULL,
                  )
              except (OSError, subprocess.CalledProcessError):
                  return []
              paths: list[Path] = []
              for value in raw.split(b"\\0"):
                  if not value:
                      continue
                  relative = Path(os.fsdecode(value))
                  if any(part in EXCLUDED_PARTS for part in relative.parts):
                      continue
                  paths.append(root / relative)
              return sorted(paths, key=lambda path: path.relative_to(root).as_posix())
          '''
          old_git = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_git.splitlines()) + '\n'

          new_git = '''_SNAPSHOT_SOURCE_CACHE: dict[tuple[str, str], dict[str, str] | None] = {}


          def _git_snapshot_sources(root: Path) -> dict[str, str] | None:
              key = (str(root.resolve()), AUDIT_SNAPSHOT_SHA)
              if key in _SNAPSHOT_SOURCE_CACHE:
                  return _SNAPSHOT_SOURCE_CACHE[key]
              try:
                  archive = subprocess.check_output(
                      ["git", "-C", str(root), "archive", "--format=tar", AUDIT_SNAPSHOT_SHA],
                      stderr=subprocess.DEVNULL,
                  )
              except (OSError, subprocess.CalledProcessError):
                  _SNAPSHOT_SOURCE_CACHE[key] = None
                  return None
              sources: dict[str, str] = {}
              with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as handle:
                  for member in handle.getmembers():
                      if not member.isfile() or not member.name.endswith(".py"):
                          continue
                      extracted = handle.extractfile(member)
                      if extracted is None:
                          continue
                      sources[Path(member.name).as_posix()] = extracted.read().decode(
                          "utf-8", errors="replace"
                      )
              _SNAPSHOT_SOURCE_CACHE[key] = sources
              return sources


          def _git_tracked_python_files(root: Path) -> list[Path]:
              sources = _git_snapshot_sources(root)
              if sources is None:
                  return []
              paths: list[Path] = []
              for value in sorted(sources):
                  relative = Path(value)
                  if any(part in EXCLUDED_PARTS for part in relative.parts):
                      continue
                  paths.append(root / relative)
              return paths


          def _read_source(root: Path, path: Path) -> str:
              relative = path.relative_to(root).as_posix()
              sources = _git_snapshot_sources(root)
              if sources is not None and relative in sources:
                  return sources[relative]
              try:
                  return path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  return path.read_text(encoding="utf-8", errors="replace")
          '''
          new_git = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_git.splitlines()) + '\n'

          current_read_8 = '''        try:
                      source = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      source = path.read_text(encoding="utf-8", errors="replace")
          '''
          current_read_8 = '\n'.join(line[10:] if line.startswith('          ') else line for line in current_read_8.splitlines())
          replacement_read_8 = '        source = _read_source(root, path)\n'

          current_read_4 = '''    try:
                  source = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  source = path.read_text(encoding="utf-8", errors="replace")
          '''
          current_read_4 = '\n'.join(line[10:] if line.startswith('          ') else line for line in current_read_4.splitlines())
          replacement_read_4 = '    source = _read_source(root, path)\n'

          test_template = '''

          def test_audit_snapshot_freezes_paths_and_source_content(tmp_path):
              module = _load_module()
              subprocess.check_call(["git", "init", "-q"], cwd=tmp_path)
              subprocess.check_call(["git", "config", "user.email", "audit@example.invalid"], cwd=tmp_path)
              subprocess.check_call(["git", "config", "user.name", "Audit Test"], cwd=tmp_path)
              (tmp_path / "baseline.py").write_text("VALUE = 'baseline'\\n", encoding="utf-8")
              subprocess.check_call(["git", "add", "baseline.py"], cwd=tmp_path)
              subprocess.check_call(["git", "commit", "-q", "-m", "baseline"], cwd=tmp_path)
              snapshot = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=tmp_path, text=True).strip()
              (tmp_path / "baseline.py").write_text("VALUE = 'changed'\\n", encoding="utf-8")
              (tmp_path / "later.py").write_text("VALUE = 'later'\\n", encoding="utf-8")
              subprocess.check_call(["git", "add", "baseline.py", "later.py"], cwd=tmp_path)
              subprocess.check_call(["git", "commit", "-q", "-m", "later"], cwd=tmp_path)

              original = module.AUDIT_SNAPSHOT_SHA
              module.AUDIT_SNAPSHOT_SHA = snapshot
              try:
                  relative = [
                      path.relative_to(tmp_path).as_posix()
                      for path in module._git_tracked_python_files(tmp_path)
                  ]
                  source = module._read_source(tmp_path, tmp_path / "baseline.py")
              finally:
                  module.AUDIT_SNAPSHOT_SHA = original

              assert relative == ["baseline.py"]
              assert "'baseline'" in source
              assert "'changed'" not in source
          '''
          test_template = '\n'.join(line[10:] if line.startswith('          ') else line for line in test_template.splitlines()) + '\n'

          for config in configs:
              script = config['script']
              text = script.read_text(encoding='utf-8')
              assert 'AUDIT_SNAPSHOT_SHA' not in text
              text = text.replace('import ast\n', 'import ast\nimport io\n', 1)
              text = text.replace('import subprocess\n', 'import subprocess\nimport tarfile\n', 1)
              text = text.replace(
                  config['schema'],
                  config['schema'] + f'\nAUDIT_SNAPSHOT_SHA = "{config["snapshot"]}"',
                  1,
              )
              assert old_git in text, script
              text = text.replace(old_git, new_git, 1)
              if config['label'] == 'M0-A':
                  assert current_read_8 in text, script
                  text = text.replace(current_read_8, replacement_read_8, 1)
              else:
                  assert current_read_4 in text, script
                  text = text.replace(current_read_4, replacement_read_4, 1)
              script.write_text(text, encoding='utf-8')

              test_path = config['test']
              test = test_path.read_text(encoding='utf-8')
              assert 'test_audit_snapshot_freezes_paths_and_source_content' not in test
              test_path.write_text(test.rstrip() + test_template, encoding='utf-8')

              doc_path = config['doc']
              doc = doc_path.read_text(encoding='utf-8')
              marker = 'Generated JSON must not be committed.'
              if marker not in doc:
                  marker = 'Generated JSON must not be committed.'
              assert marker in doc
              paragraph = (
                  f"\n\nThe audit path and source-content universe is frozen to the merged {config['label']} "
                  f"snapshot `{config['snapshot']}`. Later Python additions, deletions, or edits cannot "
                  "retroactively change this completed audit's canonical output. Fixture repositories "
                  "without that snapshot continue to use their local files for focused tests."
              )
              assert 'source-content universe is frozen' not in doc
              doc_path.write_text(doc.replace(marker, marker + paragraph, 1), encoding='utf-8')
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            docs/audit/M0_A_RUNTIME_ENTRYPOINT_AND_MUTATION_MAP.md \
            docs/audit/M0_B_GATE_FAILURE_CLOCK_CONCURRENCY_MAP.md \
            docs/audit/M0_C_PERSISTENCE_AND_STATE_MAP.md \
            scripts/audit/m0_a_runtime_inventory.py \
            scripts/audit/m0_b_controlflow_concurrency_inventory.py \
            scripts/audit/m0_c_persistence_state_inventory.py \
            tests/audit/test_m0_a_runtime_inventory.py \
            tests/audit/test_m0_b_controlflow_concurrency_inventory.py \
            tests/audit/test_m0_c_persistence_state_inventory.py | sort)"
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $changed
          git commit -m "Pin M0-A B C audits to merged snapshots"
          test -z "$(git status --short)"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          import sys
          import urllib.request
          url = 'https://files.pythonhosted.org/packages/72/d2/ef65d0f3c150bfc99f5c4a516ae57e7c3acddfaacc1196dd296b1299ea7f/markdown_strings-3.4.0.tar.gz'
          expected = '7574de0606160d7291ac2e1933a8ed47d31f0b49b674f128da1f548930c8578b'
          target = pathlib.Path('/tmp/markdown_strings-3.4.0.tar.gz')
          urllib.request.urlretrieve(url, target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == expected
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(target)])
          PY
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile and reproduce canonical audits
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            scripts/audit/m0_a_runtime_inventory.py \
            scripts/audit/m0_b_controlflow_concurrency_inventory.py \
            scripts/audit/m0_c_persistence_state_inventory.py \
            tests/audit/test_m0_a_runtime_inventory.py \
            tests/audit/test_m0_b_controlflow_concurrency_inventory.py \
            tests/audit/test_m0_c_persistence_state_inventory.py
          for name in a b c; do
            case "$name" in
              a) script=scripts/audit/m0_a_runtime_inventory.py ;;
              b) script=scripts/audit/m0_b_controlflow_concurrency_inventory.py ;;
              c) script=scripts/audit/m0_c_persistence_state_inventory.py ;;
            esac
            python "$script" --output "/tmp/m0-${name}-1.json"
            python "$script" --output "/tmp/m0-${name}-2.json"
            diff -u "/tmp/m0-${name}-1.json" "/tmp/m0-${name}-2.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {
              'a': (578, 13341),
              'b': (580, 4063),
              'c': (582, 7669),
          }
          for name, (files, entries) in expected.items():
              payload = json.loads(Path(f'/tmp/m0-{name}-1.json').read_text(encoding='utf-8'))
              summary = payload['summary']
              assert summary['python_files_scanned'] == files, (name, summary['python_files_scanned'])
              assert summary['total_entries'] == entries, (name, summary['total_entries'])
          PY
      - name: Run focused audit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/audit/test_m0_a_runtime_inventory.py \
            tests/audit/test_m0_b_controlflow_concurrency_inventory.py \
            tests/audit/test_m0_c_persistence_state_inventory.py | tee /tmp/focused.txt
      - name: Collect full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q | tee /tmp/collect.txt
      - name: Run full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q | tee /tmp/full.txt
      - name: Verify exact correction scope and push
        shell: bash
        run: |
          set -euo pipefail
          base="$(cat /tmp/base-head.txt)"
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            docs/audit/M0_A_RUNTIME_ENTRYPOINT_AND_MUTATION_MAP.md \
            docs/audit/M0_B_GATE_FAILURE_CLOCK_CONCURRENCY_MAP.md \
            docs/audit/M0_C_PERSISTENCE_AND_STATE_MAP.md \
            scripts/audit/m0_a_runtime_inventory.py \
            scripts/audit/m0_b_controlflow_concurrency_inventory.py \
            scripts/audit/m0_c_persistence_state_inventory.py \
            tests/audit/test_m0_a_runtime_inventory.py \
            tests/audit/test_m0_b_controlflow_concurrency_inventory.py \
            tests/audit/test_m0_c_persistence_state_inventory.py | sort)"
          test "$changed" = "$expected"
          test -z "$(git status --short)"
          git rev-parse HEAD | tee /tmp/final-head.txt
          printf '%s\n' "$changed" > /tmp/scope.txt
          git push origin HEAD:"$TARGET_BRANCH"
      - name: Upload snapshot-pin evidence
        uses: actions/upload-artifact@v4
        with:
          name: m0-abc-audit-snapshot-pin-validation
          path: |
            /tmp/m0-a-1.json
            /tmp/m0-a-2.json
            /tmp/m0-b-1.json
            /tmp/m0-b-2.json
            /tmp/m0-c-1.json
            /tmp/m0-c-2.json
            /tmp/focused.txt
            /tmp/collect.txt
            /tmp/full.txt
            /tmp/scope.txt
            /tmp/final-head.txt
          if-no-files-found: error
