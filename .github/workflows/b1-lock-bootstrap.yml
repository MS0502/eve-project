name: Validation lock reproducibility check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Reproduce validation lock
        run: |
          python -m pip install pip-tools
          cp requirements-lock.txt /tmp/requirements-lock.expected.txt
          python -m piptools compile --resolver=backtracking --generate-hashes --strip-extras --output-file=requirements-lock.txt requirements-validation.in
          diff -u /tmp/requirements-lock.expected.txt requirements-lock.txt
