name: Temporary M2-A snapshot validation fix

on:
  push:
    branches: [codex/m2-a-sqlite-shadow-persistence]

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'MS0502/eve-project'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/m2-a-sqlite-shadow-persistence
          fetch-depth: 0

      - name: Apply snapshot validation hardening
        shell: bash
        run: |
          set -euo pipefail
          cat .github/m2a-snapshot-fix.part* | base64 -d | python
          rm .github/m2a-snapshot-fix.part*

      - name: Commit hardened exact head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/sqlite_shadow_store.py \
            tests/test_v4_m2_a_sqlite_shadow_store.py \
            docs/audit/FORWARD_ADDITIONS_MANIFEST.json \
            .github/m2a-snapshot-fix.part00 \
            .github/m2a-snapshot-fix.part01 \
            .github/m2a-snapshot-fix.part02 \
            .github/m2a-snapshot-fix.part03 \
            .github/m2a-snapshot-fix.part04 \
            .github/m2a-snapshot-fix.part05 \
            .github/workflows/m2a-snapshot-validation-fix.yml
          git commit -m "Verify snapshot semantics and bound snapshot bytes"
          git push origin HEAD:codex/m2-a-sqlite-shadow-persistence
